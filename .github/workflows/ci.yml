# CI: Rust (fmt, clippy, tests), web (typecheck, lint, build), E2E (Playwright chromium against the real
# backend), secret scan (NFR-SC-05) and non-blocking dependency audits.
#
# Third-party actions are pinned to full version tags. Follow-up: pin to commit SHAs (e.g. with
# Dependabot or `pinact`) once the owner enables it.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly: also runs the extra Playwright projects (e2e-extended).
    - cron: "17 2 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  # Local services of the job (trust auth, same URLs as CLAUDE.md / RUNBOOK section 10).
  DATABASE_URL: postgres://postgres@localhost:5432/warptalk
  REDIS_URL: redis://localhost:6379

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: warptalk
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d warptalk"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4.2.2
      - name: "Install Rust (rust-toolchain.toml: stable, rustfmt, clippy)"
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2.8.0
        with:
          shared-key: rust-workspace
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  web:
    name: Web (typecheck, lint, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      # `next build` = static export to apps/web/out (what the web image and the macOS app ship).
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: test -f out/index.html

  e2e:
    name: E2E (Playwright chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: warptalk
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d warptalk"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2.8.0
        with:
          shared-key: rust-e2e
      - name: Client tools used by the E2E fixtures (psql, redis-cli)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client redis-tools
      # scripts/e2e-backend.sh (started by playwright.config.ts) reuses the service containers
      # (dev-services.sh is a no-op when Postgres/Redis already answer) and E2E_SKIP_BUILD=1 reuses these binaries.
      - name: Build api + migrator
        run: cargo build -p warptalk-migrator -p warptalk-api --locked
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web deps and Playwright browser (version pinned in package.json/lockfile)
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Playwright (chromium project)
        working-directory: apps/web
        env:
          CI: "1"
          E2E_SKIP_BUILD: "1"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx playwright test --project=chromium --trace off
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  # Other Playwright projects (export, meeting-media, macos-webview): nightly / manual only.
  e2e-extended:
    name: E2E extra projects (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: warptalk
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d warptalk"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2.8.0
        with:
          shared-key: rust-e2e
      - name: Client tools used by the E2E fixtures (psql, redis-cli)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client redis-tools
      - run: cargo build -p warptalk-migrator -p warptalk-api --locked
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web deps and Playwright browser
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Playwright (export, meeting-media, macos-webview)
        working-directory: apps/web
        env:
          CI: "1"
          E2E_SKIP_BUILD: "1"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx playwright test --project=export --project=meeting-media --project=macos-webview --trace off
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: playwright-report-extended
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      # Organization-owned repos need a free/paid GITLEAKS_LICENSE secret; personal repos do not.
      - uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  # Non-blocking: surfaces advisories as warnings/annotations; never fails the pipeline.
  audit:
    name: Dependency audit (non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - name: npm audit (production deps)
        working-directory: apps/web
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: cargo audit
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked --version 0.21.2
          cargo audit
