# Build and push images to GHCR: ghcr.io/<owner>/warptalk-{api,worker,migrator,web}
#   - push to main      -> tags: main, sha-<short>, latest
#   - tag v1.2.3        -> tags: 1.2.3, 1.2, sha-<short>
#   - pull_request      -> build only (validates the Dockerfiles), nothing is pushed
# Optional pipeline image (translation, disabled by ADR 0001) is not built here; see docs/DEPLOY.md.
# Actions are pinned to full version tags; SHA pinning is a follow-up.
name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "deploy/docker/Dockerfile.*"
      - "deploy/docker/web.Caddyfile"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/web/package.json"
      - "apps/web/package-lock.json"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: warptalk-api
            dockerfile: deploy/docker/Dockerfile.rust
            target: api
          - image: warptalk-worker
            dockerfile: deploy/docker/Dockerfile.rust
            target: worker
          - image: warptalk-migrator
            dockerfile: deploy/docker/Dockerfile.rust
            target: migrator
          - image: warptalk-web
            dockerfile: deploy/docker/Dockerfile.web
            target: runtime
    steps:
      - uses: actions/checkout@v4.2.2

      # GHCR requires lowercase repository paths; github.repository_owner can be mixed case.
      - name: Compute image name
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: echo "image=ghcr.io/${OWNER,,}/${IMAGE}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3.10.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags, OCI labels)
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}

      - name: Build and push
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
