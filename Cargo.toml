[workspace]
resolver = "3"
members = [
    "apps/*",
    "crates/shared/*",
    "crates/modules/*",
    "crates/pipeline/*",
    "crates/providers/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"

# Third-party versions are pinned here once and referenced with `{ workspace = true }`
# from member crates. Added as each crate gets real code.
[workspace.dependencies]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
