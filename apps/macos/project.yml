name: WarpTalk
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.2"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"                      # Swift language MODE 5 (the code is not Swift-6 strict-concurrency clean); toolchain >= 6.1
    ENABLE_USER_SCRIPT_SANDBOXING: NO         # the web-bundle phase reads ../web/out and writes into the app bundle
packages:
  CopilotCore:
    path: CopilotCore
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    exactVersion: 2.19.0   # API verified against this tag (see Features/External/*.swift). Its Package.swift needs swift-tools 6.1 = Xcode 16.3+
targets:
  WarpTalk:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    dependencies:
      - package: LiveKit
      - package: CopilotCore   # local package (module CopilotCore); needs `make core` first
    postBuildScripts:
      # Copies apps/web/out (Next.js `output: 'export'`) to WarpTalk.app/Contents/Resources/web when it exists.
      # Optional unless REQUIRE_WEB_BUNDLE=YES (make bundle). Override the source with WEB_OUT_DIR=/path.
      - name: Bundle web export
        script: |
          bash "${SRCROOT}/Scripts/copy-web.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.warptalk   # PLACEHOLDER: change to your own reverse-DNS id
        PRODUCT_NAME: WarpTalk
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/WarpTalk.entitlements
        MARKETING_VERSION: "0.2.1"
        CURRENT_PROJECT_VERSION: "3"
        ENABLE_TESTABILITY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: WarpTalk
        CFBundleDisplayName: WarpTalk
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.2"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSMicrophoneUsageDescription: "WarpTalk dùng micro của bạn để gửi giọng nói vào phòng dịch trực tiếp."
        NSCameraUsageDescription: "WarpTalk dùng camera để hiển thị hình của bạn trong phòng họp."
        NSAudioCaptureUsageDescription: "WarpTalk ghi lại âm thanh của ứng dụng họp (Chrome, Zoom, Teams...) để dịch cuộc họp bên ngoài."
        NSScreenCaptureUsageDescription: "WarpTalk chỉ dùng quyền Ghi màn hình (phương án dự phòng) để lấy âm thanh của ứng dụng họp, không lưu hình ảnh."
        # DEMO ONLY: allow plain http/ws to the Next.js dev server (http://localhost:3000), the backend and LiveKit.
        # Remove for production (https/wss only).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Resources/WarpTalk.entitlements
      properties:
        # DEMO: sandbox OFF so Core Audio process taps + CoreAudio device enumeration work without
        # extra entitlements. Before App Store/notarized release re-enable the sandbox and re-test taps.
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
  WarpTalkTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: WarpTalk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.warptalk.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WarpTalk.app/Contents/MacOS/WarpTalk"
schemes:
  WarpTalk:
    build:
      targets:
        WarpTalk: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WarpTalkTests
