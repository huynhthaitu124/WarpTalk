[package]
name = "warptalk-pipeline"
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "warptalk_pipeline"
path = "src/lib.rs"

[[bin]]
name = "warptalk-pipeline"
path = "src/main.rs"

# [[bin]]
# name = "pipeline-bench"
# path = "src/bin/pipeline_bench.rs"

[features]
default = []
# LiveKit RTC transport (src/livekit_transport.rs). OFF by default: the `livekit` crate
# (webrtc-sys) needs clang >= 21 to build. Enabling it also needs the optional dependency
# lines listed in LIVEKIT.md (they are not in the root Cargo.toml yet).
livekit-rtc = ["dep:livekit"]

[dependencies]
livekit = { workspace = true, optional = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
metrics = { workspace = true }
rand = { workspace = true }
redis = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
warptalk-audio = { workspace = true }
warptalk-bus = { workspace = true }
warptalk-config = { workspace = true }
warptalk-cartesia = { workspace = true }
warptalk-contracts = { workspace = true }
warptalk-db = { workspace = true }
warptalk-ingress = { workspace = true }
warptalk-kernel = { workspace = true }
warptalk-livekit = { workspace = true }
warptalk-llm = { workspace = true }
warptalk-mt = { workspace = true }
warptalk-pipeline-runtime = { workspace = true }
warptalk-settings = { workspace = true }
warptalk-stt = { workspace = true }
warptalk-telemetry = { workspace = true }
warptalk-tts = { workspace = true }

[dev-dependencies]
warptalk-transcript = { workspace = true }
warptalk-web = { workspace = true }
