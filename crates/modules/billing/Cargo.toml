[package]
name = "warptalk-billing"
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
redis = { workspace = true }
tokio = { workspace = true }
warptalk-kernel = { workspace = true, features = ["axum"] }
warptalk-db = { workspace = true }
warptalk-web = { workspace = true }
warptalk-bus = { workspace = true }
warptalk-contracts = { workspace = true }
# Not in [workspace.dependencies] (root Cargo.toml is off-limits): needs `warptalk-stripe = { path = "crates/providers/stripe" }` there, then switch to `{ workspace = true }`.
warptalk-stripe = { path = "../../providers/stripe" }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
wiremock = { workspace = true }
warptalk-config = { workspace = true }
