[package]
name = "warptalk-copilot-core"
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "warptalk_copilot_core"
crate-type = ["lib", "staticlib"]

[features]
default = []
# UniFFI bindings for the macOS app (Swift). See scripts/build-xcframework.sh.
ffi = ["dep:uniffi"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["ffi"]

[[bin]]
name = "copilot-cli"
path = "src/bin/copilot-cli.rs"

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uniffi = { workspace = true, optional = true }
url = { workspace = true }
uuid = { workspace = true }
warptalk-audio = { workspace = true }
warptalk-ingress = { workspace = true }
warptalk-pipeline-runtime = { workspace = true }
warptalk-stt = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
