# WarpTalk: ha tang DEV (khong cho production). Chay binary Rust bang cargo, khong co container app.
#
#   docker compose -f deploy/docker/docker-compose.yml --env-file deploy/docker/.env up -d
#   (hoac chay scripts/dev-up.sh, no lam tat ca)
#
# Mac dinh: chi postgres:16, redis:7, qdrant (cho dev-up.sh chay cargo tren host).
# Profile "apps": toan bo stack trong Docker, gom ca livekit + pipeline (WarpBot/pill can de co transcript).
#   scripts/stack.sh up      (= docker compose ... --profile apps up -d --build)
# Profile "translation": chi livekit + pipeline, cho dev-up.sh --translation.
# Profile "minio": S3 tuong thich (tuy chon).
name: warptalk

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # DEV: trust auth (khop CLAUDE.md va e2e/cargo test: postgres://postgres@localhost). Chi bind 127.0.0.1.
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: ${POSTGRES_DB:-warptalk}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-warptalk}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    # Khong healthcheck (anh qdrant khong co curl/wget): scripts/dev-up.sh doi http://localhost:6333/readyz.

  # LiveKit + pipeline are part of the app stack: WarpBot/pill bridge capture publishes the meeting audio
  # here and the pipeline transcribes it. Without them a room never gets a transcript.
  livekit:
    image: livekit/livekit-server:latest
    profiles: ["apps", "translation"]
    restart: unless-stopped
    command: ["--dev", "--config", "/etc/livekit.yaml", "--bind", "0.0.0.0"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"            # signalling (ws://localhost:7880) + HTTP API
      - "7881:7881"            # RTC qua TCP
      - "50000-50100:50000-50100/udp"   # RTC qua UDP (khop livekit.yaml)
    extra_hosts:
      # de webhook toi API chay tren may host (Linux can dong nay; Docker Desktop da co san)
      - "host.docker.internal:host-gateway"
    # Khong healthcheck: anh livekit-server la binary tinh (khong shell/curl).
    # scripts/dev-up.sh tu kiem tra http://localhost:7880 (tra "OK").

  # Tuy chon: S3 tuong thich cho upload tai lieu (chua noi vao code; dung de thu sau).
  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 4s
      retries: 20

  # ---------------------------------------------------------------------------------------------
  # App containers (profile "apps"): migrator -> api + worker, web (static export + Caddy, /api -> api).
  #   docker compose -f deploy/docker/docker-compose.yml --env-file deploy/docker/.env \
  #     --profile apps --profile translation up -d --build
  # Host ports: web http://localhost:3000 (macOS app dev UI), api http://localhost:8090.
  # .env is shared with the cargo workflow, so every localhost URL is overridden with a service name.
  migrator:
    profiles: ["apps"]
    image: warptalk-migrator:dev
    build: &rust-build
      context: ../..
      dockerfile: deploy/docker/Dockerfile.rust
      target: migrator
      args: { WITH_PIPELINE: "1" }
    restart: "no"
    env_file: .env
    environment: &app-env
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}@postgres:5432/${POSTGRES_DB:-warptalk}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      LOG_FORMAT: pretty
    depends_on:
      postgres: { condition: service_healthy }

  api:
    profiles: ["apps"]
    image: warptalk-api:dev
    build: { <<: *rust-build, target: api }
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
      HTTP_BIND: 0.0.0.0:8080
      LIVEKIT_URL: ws://localhost:7880      # URL the browser/app uses, not the service name
      LIVEKIT_API_URL: http://livekit:7880  # URL the API itself calls (Twirp) inside the compose network
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173
    ports: ["127.0.0.1:${API_PORT:-8090}:8080"]
    volumes: ["objects:/data/objects"]
    depends_on:
      migrator: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      qdrant: { condition: service_started }

  worker:
    profiles: ["apps"]
    image: warptalk-worker:dev
    build: { <<: *rust-build, target: worker }
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
      LIVEKIT_URL: ws://localhost:7880
    volumes: ["objects:/data/objects"]
    depends_on:
      migrator: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    profiles: ["apps"]
    image: warptalk-web:dev
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile.web }
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://api:8080
    ports: ["127.0.0.1:${WEB_PORT:-3000}:8080"]
    depends_on:
      api: { condition: service_healthy }

  # Realtime pipeline (LiveKit transport, real providers). Shares livekit's network namespace because
  # livekit.yaml advertises node_ip 127.0.0.1: media only works on that loopback.
  pipeline:
    profiles: ["apps", "translation"]
    image: warptalk-pipeline:dev
    build: { <<: *rust-build, target: pipeline }
    restart: unless-stopped
    network_mode: "service:livekit"
    env_file: .env
    environment:
      <<: *app-env
      LIVEKIT_URL: ws://127.0.0.1:7880
      MEDIA_TRANSPORT: livekit
      PIPELINE_FAKE_PROVIDERS: ""
    depends_on:
      livekit: { condition: service_started }
      redis: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }

volumes:
  objects:
  pgdata:
  redisdata:
  qdrantdata:
  miniodata:
